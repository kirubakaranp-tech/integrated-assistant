<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box { stroke-width: 1.5; rx: 10; }
      .title { font-size: 16px; font-weight: 600; fill: #0f172a; }
      .text { font-size: 12.5px; fill: #334155; }
      .small { font-size: 11.5px; fill: #475569; }
      .label { font-size: 11.5px; fill: #334155; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Integrated AI Assistant - architecture</text>

  <rect class="box" x="30" y="215" width="170" height="120" fill="#eff6ff" stroke="#3b82f6"/>
  <text class="title" x="115" y="245" text-anchor="middle">UI (chat page)</text>
  <text class="text" x="115" y="270" text-anchor="middle">HTML + JavaScript</text>
  <text class="small" x="115" y="290" text-anchor="middle">chat, upload, sources,</text>
  <text class="small" x="115" y="306" text-anchor="middle">"How I got this", email draft</text>
  <text class="small" x="115" y="324" text-anchor="middle">localhost:5500</text>

  <rect class="box" x="270" y="60" width="350" height="470" fill="#f8fafc" stroke="#0f766e"/>
  <text class="title" x="445" y="88" text-anchor="middle">FastAPI backend (port 8000)</text>

  <rect class="box" x="290" y="105" width="310" height="80" fill="#ffffff" stroke="#94a3b8"/>
  <text class="text" x="305" y="128" font-weight="600">POST /documents   GET /documents</text>
  <text class="small" x="305" y="149">check type, extract text (PyMuPDF, python-docx),</text>
  <text class="small" x="305" y="167">split into chunks, embed (all-MiniLM-L6-v2)</text>

  <rect class="box" x="290" y="200" width="310" height="100" fill="#ffffff" stroke="#94a3b8"/>
  <text class="text" x="305" y="223" font-weight="600">POST /chat</text>
  <text class="small" x="305" y="244">embed question, find the 4 closest chunks,</text>
  <text class="small" x="305" y="262">build the prompt with the last 5 messages,</text>
  <text class="small" x="305" y="280">let the LLM call tools, return answer + sources</text>

  <rect class="box" x="290" y="315" width="310" height="62" fill="#ffffff" stroke="#94a3b8"/>
  <text class="text" x="305" y="338" font-weight="600">POST /draft-email</text>
  <text class="small" x="305" y="358">session history to a JSON subject + body (Pydantic)</text>

  <rect class="box" x="290" y="392" width="310" height="118" fill="#fefce8" stroke="#ca8a04"/>
  <text class="text" x="305" y="415" font-weight="600">Tools (the LLM picks a tool and an id)</text>
  <text class="small" x="305" y="437">get_customer_details(customer_id)</text>
  <text class="small" x="305" y="455">get_order_status(order_id)</text>
  <text class="small" x="305" y="473">get_customer_orders(customer_id)</text>
  <text class="small" x="305" y="495">errors become clean messages</text>

  <rect class="box" x="700" y="75" width="230" height="95" fill="#f5f3ff" stroke="#7c3aed"/>
  <text class="title" x="815" y="103" text-anchor="middle">Vector store</text>
  <text class="text" x="815" y="126" text-anchor="middle">Chroma (on disk)</text>
  <text class="small" x="815" y="146" text-anchor="middle">chunks + embeddings +</text>
  <text class="small" x="815" y="162" text-anchor="middle">file name and page</text>

  <rect class="box" x="700" y="195" width="230" height="95" fill="#fff1f2" stroke="#e11d48"/>
  <text class="title" x="815" y="223" text-anchor="middle">LLM</text>
  <text class="text" x="815" y="246" text-anchor="middle">OpenAI-compatible API</text>
  <text class="small" x="815" y="266" text-anchor="middle">OpenAI gpt-4o-mini or</text>
  <text class="small" x="815" y="282" text-anchor="middle">Groq openai/gpt-oss-120b</text>

  <rect class="box" x="700" y="315" width="230" height="85" fill="#ecfdf5" stroke="#059669"/>
  <text class="title" x="815" y="343" text-anchor="middle">CRM (mock)</text>
  <text class="text" x="815" y="366" text-anchor="middle">FastAPI, port 8001</text>
  <text class="small" x="815" y="385" text-anchor="middle">GET /customers/{id}</text>

  <rect class="box" x="700" y="425" width="230" height="95" fill="#eff6ff" stroke="#2563eb"/>
  <text class="title" x="815" y="453" text-anchor="middle">PostgreSQL</text>
  <text class="text" x="815" y="476" text-anchor="middle">orders_db: orders, order_items</text>
  <text class="small" x="815" y="496" text-anchor="middle">read-only user,</text>
  <text class="small" x="815" y="512" text-anchor="middle">parameterised queries</text>

  <path class="line both" d="M200,275 L268,275"/>
  <text class="label" x="234" y="262" text-anchor="middle">HTTP</text>
  <text class="label" x="234" y="296" text-anchor="middle">JSON</text>

  <path class="line" d="M600,135 L698,125"/>
  <text class="label" x="648" y="120" text-anchor="middle">save chunks</text>

  <path class="line" d="M600,225 C650,215 655,165 698,152"/>
  <text class="label" x="660" y="195" text-anchor="middle">search</text>

  <path class="line" d="M600,262 L698,248"/>
  <text class="label" x="650" y="273" text-anchor="middle">prompt</text>

  <path class="line" d="M600,346 C650,346 660,285 698,272"/>
  <text class="label" x="660" y="330" text-anchor="middle">draft</text>

  <path class="line" d="M600,437 C650,437 660,370 698,360"/>
  <text class="label" x="650" y="420" text-anchor="middle">HTTP GET</text>
  <text class="small" x="650" y="403" text-anchor="middle">retry + timeout</text>

  <path class="line" d="M600,470 L698,470"/>
  <text class="label" x="650" y="462" text-anchor="middle">SELECT</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
